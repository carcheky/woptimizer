[project]
name = "woptimizer"
version = "3.0.0"
description = "Kill distractions, game faster."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "psutil>=5.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
